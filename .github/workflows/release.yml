name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build plugin
        run: npm run build

      - name: Prepare release artifacts
        run: |
          mkdir -p release
          cp main.js manifest.json styles.css release/
          cd release
          zip bitcoin-block-stamp.zip main.js manifest.json styles.css

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitcoin-block-stamp
          path: release/*

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/main.js
            release/manifest.json
            release/styles.css
            release/bitcoin-block-stamp.zip
